name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - release/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build auth-api
        run: mvn -f auth-api/pom.xml clean package -DskipTests

      - name: Build data-api
        run: mvn -f data-api/pom.xml clean package -DskipTests
