name: ci

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main, 'release/**', 'hotfix/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test auth-api
        run: ./mvnw test
        working-directory: auth-api
      - name: Test data-api
        run: ./mvnw test
        working-directory: data-api
      - name: Compose build
        run: docker compose build
