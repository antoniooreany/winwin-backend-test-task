name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

template: |
  ## Changes

  $CHANGES

change-template: '- $TITLE (#$NUMBER)'
no-changes-template: '- No user-facing changes in this draft release.'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: 'Tests'
    labels:
      - 'test'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'ci'

exclude-labels:
  - 'skip-changelog'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'documentation'
      - 'docs'
      - 'test'
      - 'chore'
      - 'ci'
  default: patch
